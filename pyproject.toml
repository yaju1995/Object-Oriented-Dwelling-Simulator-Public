[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sim"
version = "0.1.0"
description = "Dwelling energy simulator"
authors = [
    {name = "Yaju Rajbhandari"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy >= 1.26.0",
    "pandas >= 2.1.1",
    "matplotlib >= 3.8.0",
    "scipy >= 1.11.0",
    "scikit-learn >= 1.3.0",
    "pydantic >= 2.0.0",
    "gymnasium >= 0.29.0",
    "ipykernel >= 6.25.2",
    "notebook >= 7.0.0",
    "torch >= 2.2.0",
    "torchvision >= 0.17.0",
    "torchaudio >= 2.2.0",
    "tqdm >= 4.66.0"
]


[tool.setuptools.packages.find]
where = ["src"]
